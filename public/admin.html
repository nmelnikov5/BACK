<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: auto; }
        input, button { display: block; margin: 10px 0; padding: 10px; width: 100%; }
        textarea { width: 100%; height: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Панель администратора</h1>
        
        <h2>Добавить товар</h2>
        <input type="text" id="name" placeholder="Название">
        <input type="number" id="price" placeholder="Цена">
        <textarea id="description" placeholder="Описание"></textarea>
        <button onclick="addProduct()">Добавить товар</button>
        
        <h2>Обновить товар</h2>
        <input type="number" id="updateId" placeholder="ID товара">
        <input type="text" id="updateName" placeholder="Новое название">
        <input type="number" id="updatePrice" placeholder="Новая цена">
        <textarea id="updateDescription" placeholder="Новое описание"></textarea>
        <button onclick="updateProduct()">Обновить товар</button>
        
        <h2>Удалить товар</h2>
        <input type="number" id="deleteId" placeholder="ID товара">
        <button onclick="deleteProduct()">Удалить товар</button>
    </div>
    <div id="chat">
        <div id="chat-box" style="border: 1px solid #ccc; height: 200px; overflow-y: scroll; padding: 10px;"></div>
        <input type="text" id="chat-input" placeholder="Введите сообщение">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api/products";
    
        function addProduct() {
            const product = {
                name: document.getElementById("name").value,
                price: parseFloat(document.getElementById("price").value),
                description: document.getElementById("description").value
            };
            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(product)
            }).then(res => res.json()).then(alert);
        }
    
        function updateProduct() {
            const id = document.getElementById("updateId").value;
            const updatedProduct = {
                name: document.getElementById("updateName").value,
                price: parseFloat(document.getElementById("updatePrice").value),
                description: document.getElementById("updateDescription").value
            };
            fetch(`${API_URL}/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(updatedProduct)
            }).then(res => res.json()).then(alert);
        }
    
        function deleteProduct() {
            const id = document.getElementById("deleteId").value;
            fetch(`${API_URL}/${id}`, { method: "DELETE" })
                .then(res => res.json())
                .then(data => {
                    alert(`Товар с ID ${id} успешно удалён!`);
                });
        }
    
        const ws = new WebSocket("ws://localhost:8081");
        const chatBox = document.getElementById("chat-box");
    
        // Имя пользователя (фиксированное)
        const userName = "Администратор";
    
        // Функция загрузки чата из localStorage
        function loadChatMessages() {
            chatBox.innerHTML = ""; 
            let messages = JSON.parse(localStorage.getItem("chatMessages")) || [];
            messages.forEach(msg => {
                chatBox.innerHTML += `<p>${msg}</p>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    
        // Функция сохранения сообщений чата в localStorage
        function saveChatMessage(message) {
            let messages = JSON.parse(localStorage.getItem("chatMessages")) || [];
            messages.push(message);
            localStorage.setItem("chatMessages", JSON.stringify(messages));
        }
    
        ws.onmessage = (event) => {
            chatBox.innerHTML += `<p>${event.data}</p>`;
            saveChatMessage(event.data); // Теперь сообщения сохраняются ТОЛЬКО при получении
            chatBox.scrollTop = chatBox.scrollHeight;
        };
    
        function sendMessage() {
            const input = document.getElementById("chat-input");
            if (input.value.trim() !== "") {
                const message = `${userName}: ${input.value}`;
                ws.send(message); // Отправляем сообщение через WebSocket
                input.value = ""; // Очищаем поле ввода
            }
        }
    
        // Загружаем историю чата при старте
        window.onload = function () {
            loadChatMessages();
        };
    </script>
    
        
</body>
</html>
