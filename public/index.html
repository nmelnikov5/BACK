<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Каталог товаров</h1>
    
    <label for="fields-select">Выбрать данные:</label>
    <select id="fields-select" onchange="loadProducts()">
        <option value='["name", "price"]'>Название и цена</option>
        <option value='["name", "description"]'>Название и описание</option>
        <option value='["name", "categories"]'>Название и категории</option>
    </select>

    <div id="product-list" class="product-list"></div>

    <div id="chat">
        <div id="chat-box" style="border: 1px solid #ccc; height: 200px; overflow-y: scroll; padding: 10px;"></div>
        <input type="text" id="chat-input" placeholder="Введите сообщение">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        async function loadProducts() {
            const fields = JSON.parse(document.getElementById("fields-select").value);
            const query = `
                {
                    products(fields: ${JSON.stringify(fields)}) {
                        ${fields.join("\n")}
                    }
                }
            `;

            const response = await fetch("/graphql", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query })
            });

            const result = await response.json();
            console.log("Ответ сервера:", result);
            const products = result.data.products;

            const productList = document.getElementById("product-list");
            productList.innerHTML = "";

            products.forEach(product => {
                const productCard = document.createElement("div");
                productCard.classList.add("product-card");
                let content = `<h2>${product.name}</h2>`;

                if (product.price !== undefined) {
                    content += `<p><strong>Цена:</strong> ${product.price} руб.</p>`;
                }
                if (product.description !== undefined) {
                    content += `<p><strong>Описание:</strong> ${product.description}</p>`;
                }
                if (product.categories !== undefined) {
                    content += `<p><strong>Категории:</strong> ${product.categories.join(", ")}</p>`;
                }

                productCard.innerHTML = content;
                productList.appendChild(productCard);
            });
        }

        loadProducts();

        // Чат WebSocket
        const ws = new WebSocket("ws://localhost:8081");
        const chatBox = document.getElementById("chat-box");
        const userName = "Пользователь";

        function saveChatMessage(message) {
            let messages = JSON.parse(localStorage.getItem("chatMessages")) || [];
            messages.push(message);
            localStorage.setItem("chatMessages", JSON.stringify(messages));
        }

        function loadChatMessages() {
            chatBox.innerHTML = "";
            let messages = JSON.parse(localStorage.getItem("chatMessages")) || [];
            messages.forEach(msg => {
                chatBox.innerHTML += `<p>${msg}</p>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        ws.onmessage = (event) => {
            chatBox.innerHTML += `<p>${event.data}</p>`;
            saveChatMessage(event.data);
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        function sendMessage() {
            const input = document.getElementById("chat-input");
            if (input.value.trim() !== "") {
                const message = `${userName}: ${input.value}`;
                ws.send(message);
                input.value = "";
            }
        }

        window.onload = function () {
            loadChatMessages();
        };
    </script>
</body>
</html>
